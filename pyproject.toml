[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
authors = [
  {name = "Stephen McGovern", email = "svenmcgov@protonmail.com"}
]
name = "filtered_ie23_py"
version = "1.0"
description = "Python codebase for publication McGovern, S.M. Adaptive Step Selection for a Filtered Implicit Method. J Sci Comput 103, 54 (2025). https://doi.org/10.1007/s10915-025-02861-w."
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["filtered_ie23_py", "filtered_ie23_py.methods", "filtered_ie23_py.ODEs"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
markers = [
  "unit",
  "integration",
]